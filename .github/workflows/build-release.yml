name: Build and Release Fiscalberry

on:
  push:
    branches:
      - v3.0.x
    paths:
      # El release se dispara cuando se bumpea la versión. Cambiar version.py
      # (y pushear a v3.0.x) es la señal de "publicar release".
      - "src/fiscalberry/version.py"
  workflow_dispatch:
    inputs:
      completar_tag:
        description: >-
          Opcional. Tag de un release YA publicado al que le falta el APK
          (ej. v3.6.7): compila Android con el código de ese tag y sube el APK
          y su línea en SHA256SUMS. Vacío = build normal.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ============================================
  # VERSION: lee la versión de version.py y decide si hay que releasear
  # (solo si el tag vX.Y.Z todavía no existe → evita releases duplicados)
  # ============================================
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      tag: ${{ steps.get.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
      # completar=true: no se publica un release nuevo, se le agrega el APK a
      # uno existente (input completar_tag). ref: qué código se compila.
      completar: ${{ steps.get.outputs.completar }}
      ref: ${{ steps.get.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from version.py
        id: get
        env:
          COMPLETAR_TAG: ${{ inputs.completar_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          leer_version() { grep -oP 'VERSION\s*=\s*["'\'']\K[^"'\'']+'; }

          if [ -z "$COMPLETAR_TAG" ]; then
            VERSION=$(leer_version < src/fiscalberry/version.py)
            if [ -z "$VERSION" ]; then
              echo "::error::No pude leer VERSION de src/fiscalberry/version.py"
              exit 1
            fi
            echo "completar=false" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            # Completar un release ya publicado. Todo se valida ACÁ, antes de
            # gastar 20 minutos compilando algo que después no se puede subir.
            if ! [[ "$COMPLETAR_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::completar_tag tiene que ser de la forma vX.Y.Z (vino '$COMPLETAR_TAG')"
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/$COMPLETAR_TAG" >/dev/null; then
              echo "::error::El tag $COMPLETAR_TAG no existe"
              exit 1
            fi
            # El APK toma su versionName de version.py, y el updater descarta
            # un APK que no diga la versión del release: se compila el código
            # DEL TAG, y tiene que coincidir.
            VERSION=$(git show "$COMPLETAR_TAG:src/fiscalberry/version.py" | leer_version)
            if [ "v$VERSION" != "$COMPLETAR_TAG" ]; then
              echo "::error::version.py en $COMPLETAR_TAG dice '$VERSION': el APK saldría con otra versión y los equipos lo rechazarían"
              exit 1
            fi
            if ! ASSETS=$(gh release view "$COMPLETAR_TAG" --json assets --jq '.assets[].name'); then
              echo "::error::No hay un release publicado para $COMPLETAR_TAG"
              exit 1
            fi
            if grep -qx 'fiscalberry-android-gui.apk' <<<"$ASSETS"; then
              echo "::error::El release $COMPLETAR_TAG ya tiene fiscalberry-android-gui.apk: no hay nada que completar. Para reemplazarlo, borrar antes el asset del release."
              exit 1
            fi
            if ! grep -qx 'SHA256SUMS' <<<"$ASSETS"; then
              echo "::error::El release $COMPLETAR_TAG no tiene SHA256SUMS: sin eso ningún equipo se actualiza, y completarlo no alcanza"
              exit 1
            fi
            echo "completar=true" >> "$GITHUB_OUTPUT"
            echo "ref=$COMPLETAR_TAG" >> "$GITHUB_OUTPUT"
            echo "Modo completar: se compila Android desde $COMPLETAR_TAG y se agrega al release existente."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión detectada: $VERSION (tag v$VERSION)"

      - name: Check if tag/release already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.get.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            [ "${{ steps.get.outputs.completar }}" = "true" ] && exit 0
            echo "::warning::El tag v${{ steps.get.outputs.version }} ya existe — se omite la creación del release. Bumpeá version.py para publicar uno nuevo."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "El tag v${{ steps.get.outputs.version }} no existe → se construirá y publicará."
          fi
  # ============================================
  # TESTS: la suite tiene que pasar antes de compilar nada. Un binario que
  # no arranca no se descubre compilando, se descubre acá.
  # ============================================
  tests:
    uses: ./.github/workflows/tests.yml

  # ============================================
  # LINUX BUILDS (GUI + CLI)
  # ============================================
  build-linux:
    needs: [version, tests]
    # En modo completar solo se recompila Android: los binarios de Linux y
    # Windows del release ya están publicados y no se tocan.
    if: >-
      needs.version.outputs.completar != 'true' &&
      (needs.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch')
    # NO usar ubuntu-latest: GitHub ya lo mapea a 24.04 (glibc 2.39) y un binario
    # de PyInstaller solo corre en glibc IGUAL O MAS NUEVA que la de compilacion.
    # Compilando en 24.04, el binario falla con "GLIBC_2.38 not found" en Ubuntu
    # 22.04 (2.35), Debian 12 (2.36) y Debian 11 (2.31) — o sea, en buena parte
    # de las maquinas donde esto corre de verdad. glibc es compatible hacia
    # adelante, asi que hay que compilar en la distro mas VIEJA que soportemos.
    # 22.04 es la mas antigua que ofrece GitHub hoy.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.kivy.txt
          pip install pyinstaller

      - name: Build Linux GUI
        env:
          KIVY_NO_CONSOLELOG: 1
          KIVY_NO_ARGS: 1
        run: |
          PYTHONPATH=src xvfb-run -a pyinstaller --clean -y fiscalberry-gui.spec

      - name: Build Linux CLI
        run: |
          PYTHONPATH=src xvfb-run -a pyinstaller --clean -y fiscalberry-cli.spec

      # Los builds son ONEDIR: dist/fiscalberry-gui es una CARPETA (ejecutable +
      # _internal), no un binario suelto. tar la empaqueta igual, con carpeta y
      # todo, que es lo que el auto-updater espera encontrar adentro.
      - name: Package Linux Binaries
        run: |
          cd dist
          tar -czf fiscalberry-linux-gui.tar.gz fiscalberry-gui
          tar -czf fiscalberry-linux-cli.tar.gz fiscalberry-cli

      - name: Upload Linux GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-linux-gui
          path: dist/fiscalberry-linux-gui.tar.gz

      - name: Upload Linux CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-linux-cli
          path: dist/fiscalberry-linux-cli.tar.gz

  # ============================================
  # WINDOWS BUILDS (GUI + CLI)
  # ============================================
  build-windows:
    needs: [version, tests]
    if: >-
      needs.version.outputs.completar != 'true' &&
      (needs.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.kivy.txt
          pip install pyinstaller

      - name: Build Windows GUI
        env:
          KIVY_NO_CONSOLELOG: 1
          KIVY_NO_ARGS: 1
          KIVY_GL_BACKEND: mock
        run: |
          $env:PYTHONPATH="src"
          pyinstaller --clean -y fiscalberry-gui.spec

      - name: Build Windows CLI
        env:
          KIVY_NO_CONSOLELOG: 1
          KIVY_NO_ARGS: 1
          KIVY_GL_BACKEND: mock
        run: |
          $env:PYTHONPATH="src"
          pyinstaller --clean -y fiscalberry-cli.spec

      # Los builds son ONEDIR: dist/fiscalberry-gui es una CARPETA (ejecutable +
      # _internal), no un .exe suelto. Se comprime la carpeta entera.
      - name: Package Windows Binaries
        run: |
          cd dist
          Compress-Archive -Path fiscalberry-gui -DestinationPath fiscalberry-windows-gui.zip
          Compress-Archive -Path fiscalberry-cli -DestinationPath fiscalberry-windows-cli.zip

      - name: Upload Windows GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-windows-gui
          path: dist/fiscalberry-windows-gui.zip

      - name: Upload Windows CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-windows-cli
          path: dist/fiscalberry-windows-cli.zip

  # ============================================
  # ANDROID GUI BUILD (con caché y signing)
  # ============================================
  build-android:
    needs: [version, tests]
    if: needs.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      # En modo completar se compila el código DEL TAG; los pasos (este
      # archivo) son los de la rama desde la que se corre, ya arreglados.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # ==========================================
      # CACHÉ: Guarda las descargas de Buildozer
      # Esto incluye SDK, NDK, y dependencias compiladas
      # Ahorra ~20-30 minutos en builds subsecuentes
      # ==========================================
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.ui.android.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.ui.android.spec') }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            buildozer-project-${{ hashFiles('buildozer.ui.android.spec') }}-
            buildozer-project-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Sin `packages`, la action instala su default 'tools platform-tools', y
      # 'tools' (el SDK Tools viejo, obsoleto hace años) ya no está en el
      # repositorio de sdkmanager: el step abortaba con "Failed to find
      # package 'tools'" y el release salía sin APK (#190). Acá no hace falta
      # ninguno de los dos: buildozer usa su propio SDK/NDK en ~/.buildozer, y
      # de este SDK solo se usa apksigner (build-tools, en el step siguiente).
      # Las licencias se aceptan igual, pero sin volcar su texto al log: eran
      # cientos de líneas que tapaban el error.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          # Toolchain PINEADO para matchear p4a v2024.01.21 (Python 3.11.x):
          # buildozer 1.5.0 + cython 0.29.x. Sin pin se instalaba buildozer/p4a
          # bleeding-edge (Python 3.14 + cython 3) y el build de Android rompía.
          pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      # La clave de firma DEBE ser siempre la misma. Si cambia, Android rechaza
      # la actualización sobre una instalación previa ("problema con el
      # paquete") y además cambia el ANDROID_ID del que se deriva el uuid del
      # dispositivo, con lo cual hay que re-vincular el comercio en cada
      # release. Antes se firmaba con la clave de debug que el runner genera al
      # vuelo: distinta en cada corrida (el caché guarda ~/.buildozer pero no
      # ~/.android, que es donde vive).
      - name: Preparar keystore de firma
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sin secret ANDROID_KEYSTORE_BASE64: se compila en debug (no publicable)."
            echo "disponible=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fiscalberry.keystore"
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        env:
          # buildozer firma y alinea el APK solo si estas variables están puestas.
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/fiscalberry.keystore
          P4A_RELEASE_KEYALIAS: fiscalberry
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HAY_KEYSTORE: ${{ steps.keystore.outputs.disponible }}
          COMPLETAR: ${{ needs.version.outputs.completar }}
        run: |
          set -o pipefail
          cp buildozer.ui.android.spec buildozer.spec
          # El caché (restore-keys) puede traer un clon viejo de p4a (master/3.14) y
          # builds para Python 3.14. Con el pin nuevo hay que limpiarlos para forzar
          # re-clone de p4a v2024.01.21 y rebuild limpio. Se conservan SDK/NDK en
          # ~/.buildozer (descargas caras).
          rm -rf .buildozer/android/platform/python-for-android
          rm -rf .buildozer/android/platform/build-*
          if [ "$HAY_KEYSTORE" = "true" ]; then
            # release: firmado con la clave fija y SIN android:debuggable, que en
            # debug deja leer la memoria del proceso — donde viven las
            # credenciales del broker, que a propósito nunca se guardan en disco.
            MODO=release
          elif [ "$COMPLETAR" = "true" ]; then
            # Un APK de debug va a un release publicado: firma distinta, ningún
            # equipo lo podría instalar encima del que tiene.
            echo "::error::Sin keystore no se puede completar un release publicado"
            exit 1
          else
            MODO=debug
          fi

          # Cada build baja de internet el SDK, el NDK y el fuente de cada
          # receta (freetype de savannah.gnu.org, SDL2, openssl, Python...)
          # cuando no hay caché, y GitHub lo desaloja a los 7 días sin uso: el
          # build de v3.6.6 arrancó sin caché. Con que un mirror conteste 502 se
          # pierde el APK: así se perdió el de v3.6.6 (#190), y p4a reintenta
          # cada descarga apenas ~15 s. Por eso se reintenta el build entero,
          # pero SOLO si en el log aparece un error de red (un error de
          # compilación corta en el primer intento). Lo ya bajado queda en disco
          # y no se vuelve a pedir.
          LOG="$RUNNER_TEMP/buildozer.log"
          for INTENTO in 1 2 3; do
            if buildozer -v android "$MODO" 2>&1 | tee "$LOG"; then
              exit 0
            fi
            if ! grep -qE 'Download failed|HTTPError|URLError|ContentTooShortError|HTTPSConnectionPool|ReadTimeout|Temporary failure in name resolution|Connection (reset|refused|timed out)|unable to access' "$LOG"; then
              echo "::error::El build de Android falló y no fue una descarga: no se reintenta. Ver el log de arriba."
              exit 1
            fi
            if [ "$INTENTO" -lt 3 ]; then
              echo "::warning::Build de Android: falló una descarga (intento $INTENTO de 3). Se reintenta en 2 minutos."
              sleep 120
            fi
          done
          echo "::error::Build de Android: las descargas siguieron fallando después de 3 intentos."
          exit 1

      - name: Find and rename APK
        id: find_apk
        run: |
          # El release deja tambien el APK sin firmar (-unsigned.apk); elegir el firmado.
          APK_PATH=$(find bin -name "*.apk" -type f ! -name "*unsigned*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No se genero ningun APK" >&2
            exit 1
          fi
          echo "APK found: $APK_PATH"
          cp "$APK_PATH" ./fiscalberry-android-gui.apk

      - name: Verificar firma del APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(find "$HOME/.buildozer" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          fi
          # Deja en el log la huella del certificado: si algun dia cambia, se ve
          # aca antes de que los usuarios no puedan actualizar.
          "$APKSIGNER" verify --print-certs ./fiscalberry-android-gui.apk | grep -i "SHA-256 digest" || true

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-android-gui
          path: ./fiscalberry-android-gui.apk

  # ============================================
  # CREATE GITHUB RELEASE
  # ============================================
  create-release:
    needs: [version, tests, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    # Publicar el release aunque Android falle: con que Linux y Windows compilen,
    # se publica con los binarios disponibles. Android es best-effort (su build es
    # frágil) y NO debe bloquear el release del resto de plataformas.
    if: >-
      always() &&
      needs.version.outputs.exists == 'false' &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux GUI Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-linux-gui
          path: ./artifacts/

      - name: Download Linux CLI Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-linux-cli
          path: ./artifacts/

      - name: Download Windows GUI Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-windows-gui
          path: ./artifacts/

      - name: Download Windows CLI Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-windows-cli
          path: ./artifacts/

      # Android es best-effort: si su build falló, el artifact no existe.
      # continue-on-error evita que eso tumbe el release.
      - name: Download Android Artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-android-gui
          path: ./artifacts/

      # El auto-updater de los dispositivos EXIGE este archivo: si un release no
      # lo trae, se niega a instalar (mejor quedarse en la version vieja que
      # aplicar un binario que no se pudo verificar). Ver
      # src/fiscalberry/common/updater/release_source.py
      - name: Generar SHA256SUMS
        run: |
          cd artifacts
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          echo "--- checksums publicados ---"
          cat SHA256SUMS

      # Sin APK se publica igual (no hay que frenar un fix de Linux/Windows
      # porque se rompió Android), pero NO en silencio: v3.6.6 y v3.6.7 salieron
      # sin APK y nadie lo notó (#190). Queda un aviso arriba de las notas del
      # release y un error en el resumen de la corrida. El aviso va entre
      # marcadores para que el job completar-release lo pueda sacar.
      - name: Avisar si falta el APK
        id: faltantes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f artifacts/fiscalberry-android-gui.apk ]; then
            exit 0
          fi
          echo "::error title=Release sin APK de Android::$TAG se publica SIN fiscalberry-android-gui.apk porque falló build-android. Una vez arreglado, completarlo con Run workflow y completar_tag=$TAG."
          {
            echo "## :warning: $TAG se publicó sin el APK de Android"
            echo ""
            echo "Falló \`build-android\`. Hasta completarlo, los equipos Android no se actualizan y \`releases/latest/download/fiscalberry-android-gui.apk\` da 404."
            echo ""
            echo "Para completarlo: **Actions → Build and Release Fiscalberry → Run workflow** sobre \`v3.0.x\`, con \`completar_tag\` = \`$TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'aviso<<FIN_AVISO'
            echo '<!-- faltantes:inicio -->'
            echo "> **:warning: Este release todavía no trae el APK de Android** (falló su build: $RUN_URL). Los equipos Android siguen en su versión actual hasta que se agregue."
            echo '<!-- faltantes:fin -->'
            echo ''
            echo 'FIN_AVISO'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # Crea el tag vX.Y.Z (leído de version.py) apuntando al commit pusheado
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # fail_on_unmatched_files=false: si falta el APK de Android (build frágil),
          # se publica igual con los binarios de Linux y Windows.
          fail_on_unmatched_files: false
          # Vacío si está todo; si falta el APK, va arriba de las notas generadas.
          body: ${{ steps.faltantes.outputs.aviso }}
          files: |
            ./artifacts/fiscalberry-linux-gui.tar.gz
            ./artifacts/fiscalberry-linux-cli.tar.gz
            ./artifacts/fiscalberry-windows-gui.zip
            ./artifacts/fiscalberry-windows-cli.zip
            ./artifacts/fiscalberry-android-gui.apk
            ./artifacts/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # COMPLETAR UN RELEASE YA PUBLICADO (Run workflow con completar_tag)
  # Le agrega el APK a un release que salió sin él. No alcanza con subir el
  # APK: el updater de Android exige su línea en SHA256SUMS, así que también se
  # republica SHA256SUMS (con las líneas de Linux/Windows intactas).
  # ============================================
  completar-release:
    needs: [version, build-android]
    if: needs.version.outputs.completar == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-android-gui
          path: ./artifacts/

      - name: Subir APK y SHA256SUMS al release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd artifacts
          gh release download "$TAG" --pattern SHA256SUMS --dir publicado
          { grep -vE '[ *]fiscalberry-android-gui\.apk$' publicado/SHA256SUMS || true; } > SHA256SUMS
          sha256sum fiscalberry-android-gui.apk >> SHA256SUMS
          echo "--- checksums publicados ---"
          cat SHA256SUMS
          # Primero el APK y después SHA256SUMS. Cualquier estado intermedio que
          # vea un equipo (APK sin su línea, o SHA256SUMS reemplazándose) hace
          # que ese ciclo no actualice y reintente después: nunca instala algo
          # sin verificar.
          gh release upload "$TAG" fiscalberry-android-gui.apk --clobber
          gh release upload "$TAG" SHA256SUMS --clobber

      - name: Sacar el aviso de APK faltante
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release view "$TAG" --json body --jq .body > notas.md
          if grep -q '<!-- faltantes:inicio -->' notas.md; then
            perl -0pi -e 's/<!-- faltantes:inicio -->.*?<!-- faltantes:fin -->\n*//s' notas.md
            gh release edit "$TAG" --notes-file notas.md
          fi
