name: Build and Release Fiscalberry

on:
  push:
    branches:
      - v3.0.x
    paths:
      # El release se dispara cuando se bumpea la versión. Cambiar version.py
      # (y pushear a v3.0.x) es la señal de "publicar release".
      - "src/fiscalberry/version.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================
  # VERSION: lee la versión de version.py y decide si hay que releasear
  # (solo si el tag vX.Y.Z todavía no existe → evita releases duplicados)
  # ============================================
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      tag: ${{ steps.get.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from version.py
        id: get
        run: |
          VERSION=$(grep -oP 'VERSION\s*=\s*["'\'']\K[^"'\'']+' src/fiscalberry/version.py)
          if [ -z "$VERSION" ]; then
            echo "::error::No pude leer VERSION de src/fiscalberry/version.py"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión detectada: $VERSION (tag v$VERSION)"

      - name: Check if tag/release already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.get.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::El tag v${{ steps.get.outputs.version }} ya existe — se omite la creación del release. Bumpeá version.py para publicar uno nuevo."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "El tag v${{ steps.get.outputs.version }} no existe → se construirá y publicará."
          fi
  # ============================================
  # TESTS: la suite tiene que pasar antes de compilar nada. Un binario que
  # no arranca no se descubre compilando, se descubre acá.
  # ============================================
  tests:
    uses: ./.github/workflows/tests.yml

  # ============================================
  # LINUX BUILDS (GUI + CLI)
  # ============================================
  build-linux:
    needs: [version, tests]
    if: needs.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    # NO usar ubuntu-latest: GitHub ya lo mapea a 24.04 (glibc 2.39) y un binario
    # de PyInstaller solo corre en glibc IGUAL O MAS NUEVA que la de compilacion.
    # Compilando en 24.04, el binario falla con "GLIBC_2.38 not found" en Ubuntu
    # 22.04 (2.35), Debian 12 (2.36) y Debian 11 (2.31) — o sea, en buena parte
    # de las maquinas donde esto corre de verdad. glibc es compatible hacia
    # adelante, asi que hay que compilar en la distro mas VIEJA que soportemos.
    # 22.04 es la mas antigua que ofrece GitHub hoy.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.kivy.txt
          pip install pyinstaller

      - name: Build Linux GUI
        env:
          KIVY_NO_CONSOLELOG: 1
          KIVY_NO_ARGS: 1
        run: |
          PYTHONPATH=src xvfb-run -a pyinstaller --clean -y fiscalberry-gui.spec

      - name: Build Linux CLI
        run: |
          PYTHONPATH=src xvfb-run -a pyinstaller --clean -y fiscalberry-cli.spec

      # Los builds son ONEDIR: dist/fiscalberry-gui es una CARPETA (ejecutable +
      # _internal), no un binario suelto. tar la empaqueta igual, con carpeta y
      # todo, que es lo que el auto-updater espera encontrar adentro.
      - name: Package Linux Binaries
        run: |
          cd dist
          tar -czf fiscalberry-linux-gui.tar.gz fiscalberry-gui
          tar -czf fiscalberry-linux-cli.tar.gz fiscalberry-cli

      - name: Upload Linux GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-linux-gui
          path: dist/fiscalberry-linux-gui.tar.gz

      - name: Upload Linux CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-linux-cli
          path: dist/fiscalberry-linux-cli.tar.gz

  # ============================================
  # WINDOWS BUILDS (GUI + CLI)
  # ============================================
  build-windows:
    needs: [version, tests]
    if: needs.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      # Firma Authenticode (#176), con el servicio de firma en la nube de
      # SSL.com (eSigner): en GitHub solo viven las credenciales del servicio,
      # la clave privada queda en su HSM. Ver docs/firma-authenticode.md.
      # Sin secretos los binarios salen sin firmar, como hasta ahora; con la
      # variable WINDOWS_SIGNING_REQUIRED=true un build sin firma válida falla
      # y, por lo tanto, no llega al release.
      SIGNING_AVAILABLE: ${{ secrets.ES_USERNAME != '' && secrets.ES_PASSWORD != '' && secrets.ES_CREDENTIAL_ID != '' && secrets.ES_TOTP_SECRET != '' }}
      SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.kivy.txt
          pip install pyinstaller

      - name: Build Windows GUI
        env:
          KIVY_NO_CONSOLELOG: 1
          KIVY_NO_ARGS: 1
          KIVY_GL_BACKEND: mock
        run: |
          $env:PYTHONPATH="src"
          pyinstaller --clean -y fiscalberry-gui.spec

      - name: Build Windows CLI
        env:
          KIVY_NO_CONSOLELOG: 1
          KIVY_NO_ARGS: 1
          KIVY_GL_BACKEND: mock
        run: |
          $env:PYTHONPATH="src"
          pyinstaller --clean -y fiscalberry-cli.spec

      - name: Check Authenticode signing
        id: firma
        run: |
          if ($env:SIGNING_AVAILABLE -eq 'true') {
            "signed=true" >> $env:GITHUB_OUTPUT
          } elseif ($env:SIGNING_REQUIRED -eq 'true') {
            throw "La firma Authenticode es obligatoria (WINDOWS_SIGNING_REQUIRED) y faltan los secretos del servicio de firma."
          } else {
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::Binarios de Windows SIN firmar: falta configurar el servicio de firma (#176, docs/firma-authenticode.md)."
          }

      # Se firman los ejecutables ANTES de empaquetarlos: el instalador y los
      # zips tienen que llevar adentro los binarios firmados.
      # Fijar la action a un SHA verificado al configurar el servicio: recibe
      # las credenciales de firma.
      - name: Sign Windows GUI
        if: steps.firma.outputs.signed == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}\dist\fiscalberry-gui\fiscalberry-gui.exe
          override: true
          clean_logs: true

      - name: Sign Windows CLI
        if: steps.firma.outputs.signed == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}\dist\fiscalberry-cli\fiscalberry-cli.exe
          override: true
          clean_logs: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "No se encontró el compilador de Inno Setup en $iscc"
          }
          & $iscc installer/fiscalberry.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup finalizó con código $LASTEXITCODE"
          }

      - name: Sign Windows Installer
        if: steps.firma.outputs.signed == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}\dist\FiscalberrySetup.exe
          override: true
          clean_logs: true

      # Editor, huella, sello de tiempo y cadena. Si algo no coincide, el
      # build falla: nunca se publica un binario con una firma inesperada.
      - name: Verify Authenticode signatures
        if: steps.firma.outputs.signed == 'true'
        run: >
          .\build_tools\verify-signatures.ps1
          -Files dist\fiscalberry-gui\fiscalberry-gui.exe,dist\fiscalberry-cli\fiscalberry-cli.exe,dist\FiscalberrySetup.exe
          -ExpectedSubject "${{ vars.WINDOWS_SIGNING_SUBJECT }}"
          -ExpectedThumbprint "${{ vars.WINDOWS_SIGNING_THUMBPRINT }}"

      # Instalación, actualización con la app abierta y /RELAUNCH=1, y
      # desinstalación que conserva config.ini (#187). El mismo script corre
      # en windows-installer.yml en cada cambio al instalador.
      - name: Test Windows Installer
        run: .\build_tools\test-windows-installer.ps1 -Setup dist\FiscalberrySetup.exe

      # Los builds son ONEDIR: dist/fiscalberry-gui es una CARPETA (ejecutable +
      # _internal), no un .exe suelto. Se comprime la carpeta entera.
      - name: Package Windows Binaries
        run: |
          cd dist
          Compress-Archive -Path fiscalberry-gui -DestinationPath fiscalberry-windows-gui.zip
          Compress-Archive -Path fiscalberry-cli -DestinationPath fiscalberry-windows-cli.zip

      - name: Upload Windows GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-windows-gui
          path: dist/fiscalberry-windows-gui.zip

      - name: Upload Windows CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-windows-cli
          path: dist/fiscalberry-windows-cli.zip

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-windows-installer
          path: dist/FiscalberrySetup.exe

  # ============================================
  # ANDROID GUI BUILD (con caché y signing)
  # ============================================
  build-android:
    needs: [version, tests]
    if: needs.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # ==========================================
      # CACHÉ: Guarda las descargas de Buildozer
      # Esto incluye SDK, NDK, y dependencias compiladas
      # Ahorra ~20-30 minutos en builds subsecuentes
      # ==========================================
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.ui.android.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.ui.android.spec') }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            buildozer-project-${{ hashFiles('buildozer.ui.android.spec') }}-
            buildozer-project-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          # Toolchain PINEADO para matchear p4a v2024.01.21 (Python 3.11.x):
          # buildozer 1.5.0 + cython 0.29.x. Sin pin se instalaba buildozer/p4a
          # bleeding-edge (Python 3.14 + cython 3) y el build de Android rompía.
          pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      # La clave de firma DEBE ser siempre la misma. Si cambia, Android rechaza
      # la actualización sobre una instalación previa ("problema con el
      # paquete") y además cambia el ANDROID_ID del que se deriva el uuid del
      # dispositivo, con lo cual hay que re-vincular el comercio en cada
      # release. Antes se firmaba con la clave de debug que el runner genera al
      # vuelo: distinta en cada corrida (el caché guarda ~/.buildozer pero no
      # ~/.android, que es donde vive).
      - name: Preparar keystore de firma
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sin secret ANDROID_KEYSTORE_BASE64: se compila en debug (no publicable)."
            echo "disponible=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fiscalberry.keystore"
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        env:
          # buildozer firma y alinea el APK solo si estas variables están puestas.
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/fiscalberry.keystore
          P4A_RELEASE_KEYALIAS: fiscalberry
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HAY_KEYSTORE: ${{ steps.keystore.outputs.disponible }}
        run: |
          cp buildozer.ui.android.spec buildozer.spec
          # El caché (restore-keys) puede traer un clon viejo de p4a (master/3.14) y
          # builds para Python 3.14. Con el pin nuevo hay que limpiarlos para forzar
          # re-clone de p4a v2024.01.21 y rebuild limpio. Se conservan SDK/NDK en
          # ~/.buildozer (descargas caras).
          rm -rf .buildozer/android/platform/python-for-android
          rm -rf .buildozer/android/platform/build-*
          if [ "$HAY_KEYSTORE" = "true" ]; then
            # release: firmado con la clave fija y SIN android:debuggable, que en
            # debug deja leer la memoria del proceso — donde viven las
            # credenciales del broker, que a propósito nunca se guardan en disco.
            buildozer -v android release
          else
            buildozer -v android debug
          fi

      - name: Find and rename APK
        id: find_apk
        run: |
          # El release deja tambien el APK sin firmar (-unsigned.apk); elegir el firmado.
          APK_PATH=$(find bin -name "*.apk" -type f ! -name "*unsigned*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No se genero ningun APK" >&2
            exit 1
          fi
          echo "APK found: $APK_PATH"
          cp "$APK_PATH" ./fiscalberry-android-gui.apk

      - name: Verificar firma del APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(find "$HOME/.buildozer" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          fi
          # Deja en el log la huella del certificado: si algun dia cambia, se ve
          # aca antes de que los usuarios no puedan actualizar.
          "$APKSIGNER" verify --print-certs ./fiscalberry-android-gui.apk | grep -i "SHA-256 digest" || true

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-android-gui
          path: ./fiscalberry-android-gui.apk

  # ============================================
  # CREATE GITHUB RELEASE
  # ============================================
  create-release:
    needs: [version, tests, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    # Publicar el release aunque Android falle: con que Linux y Windows compilen,
    # se publica con los binarios disponibles. Android es best-effort (su build es
    # frágil) y NO debe bloquear el release del resto de plataformas.
    if: >-
      always() &&
      needs.version.outputs.exists == 'false' &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux GUI Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-linux-gui
          path: ./artifacts/

      - name: Download Linux CLI Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-linux-cli
          path: ./artifacts/

      - name: Download Windows GUI Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-windows-gui
          path: ./artifacts/

      - name: Download Windows CLI Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-windows-cli
          path: ./artifacts/

      - name: Download Windows Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-windows-installer
          path: ./artifacts/

      # Android es best-effort: si su build falló, el artifact no existe.
      # continue-on-error evita que eso tumbe el release.
      - name: Download Android Artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-android-gui
          path: ./artifacts/

      # El auto-updater de los dispositivos EXIGE este archivo: si un release no
      # lo trae, se niega a instalar (mejor quedarse en la version vieja que
      # aplicar un binario que no se pudo verificar). Ver
      # src/fiscalberry/common/updater/release_source.py
      - name: Generar SHA256SUMS
        run: |
          cd artifacts
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          echo "--- checksums publicados ---"
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # Crea el tag vX.Y.Z (leído de version.py) apuntando al commit pusheado
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # fail_on_unmatched_files=false: si falta el APK de Android (build frágil),
          # se publica igual con los binarios de Linux y Windows.
          fail_on_unmatched_files: false
          files: |
            ./artifacts/fiscalberry-linux-gui.tar.gz
            ./artifacts/fiscalberry-linux-cli.tar.gz
            ./artifacts/fiscalberry-windows-gui.zip
            ./artifacts/fiscalberry-windows-cli.zip
            ./artifacts/FiscalberrySetup.exe
            ./artifacts/fiscalberry-android-gui.apk
            ./artifacts/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
