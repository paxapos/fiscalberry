name: Build and Release Fiscalberry

on:
  push:
    branches:
      - v3.0.x
    paths:
      # El release se dispara cuando se bumpea la versión. Cambiar version.py
      # (y pushear a v3.0.x) es la señal de "publicar release".
      - "src/fiscalberry/version.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================
  # VERSION: lee la versión de version.py y decide si hay que releasear
  # (solo si el tag vX.Y.Z todavía no existe → evita releases duplicados)
  # ============================================
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      tag: ${{ steps.get.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from version.py
        id: get
        run: |
          VERSION=$(grep -oP 'VERSION\s*=\s*["'\'']\K[^"'\'']+' src/fiscalberry/version.py)
          if [ -z "$VERSION" ]; then
            echo "::error::No pude leer VERSION de src/fiscalberry/version.py"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión detectada: $VERSION (tag v$VERSION)"

      - name: Check if tag/release already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.get.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::El tag v${{ steps.get.outputs.version }} ya existe — se omite la creación del release. Bumpeá version.py para publicar uno nuevo."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "El tag v${{ steps.get.outputs.version }} no existe → se construirá y publicará."
          fi
  # ============================================
  # LINUX BUILDS (GUI + CLI)
  # ============================================
  build-linux:
    needs: version
    if: needs.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.kivy.txt
          pip install pyinstaller

      - name: Build Linux GUI
        env:
          KIVY_NO_CONSOLELOG: 1
          KIVY_NO_ARGS: 1
        run: |
          PYTHONPATH=src xvfb-run -a pyinstaller --clean -y fiscalberry-gui.spec

      - name: Build Linux CLI
        run: |
          PYTHONPATH=src xvfb-run -a pyinstaller --clean -y fiscalberry-cli.spec

      - name: Package Linux Binaries
        run: |
          cd dist
          tar -czf fiscalberry-linux-gui.tar.gz fiscalberry-gui
          tar -czf fiscalberry-linux-cli.tar.gz fiscalberry-cli

      - name: Upload Linux GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-linux-gui
          path: dist/fiscalberry-linux-gui.tar.gz

      - name: Upload Linux CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-linux-cli
          path: dist/fiscalberry-linux-cli.tar.gz

  # ============================================
  # WINDOWS BUILDS (GUI + CLI)
  # ============================================
  build-windows:
    needs: version
    if: needs.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.kivy.txt
          pip install pyinstaller

      - name: Build Windows GUI
        env:
          KIVY_NO_CONSOLELOG: 1
          KIVY_NO_ARGS: 1
          KIVY_GL_BACKEND: mock
        run: |
          $env:PYTHONPATH="src"
          pyinstaller --clean -y fiscalberry-gui.spec

      - name: Build Windows CLI
        env:
          KIVY_NO_CONSOLELOG: 1
          KIVY_NO_ARGS: 1
          KIVY_GL_BACKEND: mock
        run: |
          $env:PYTHONPATH="src"
          pyinstaller --clean -y fiscalberry-cli.spec

      - name: Package Windows Binaries
        run: |
          cd dist
          Compress-Archive -Path fiscalberry-gui.exe -DestinationPath fiscalberry-windows-gui.zip
          Compress-Archive -Path fiscalberry-cli.exe -DestinationPath fiscalberry-windows-cli.zip

      - name: Upload Windows GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-windows-gui
          path: dist/fiscalberry-windows-gui.zip

      - name: Upload Windows CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-windows-cli
          path: dist/fiscalberry-windows-cli.zip

  # ============================================
  # ANDROID GUI BUILD (con caché y signing)
  # ============================================
  build-android:
    needs: version
    if: needs.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # ==========================================
      # CACHÉ: Guarda las descargas de Buildozer
      # Esto incluye SDK, NDK, y dependencias compiladas
      # Ahorra ~20-30 minutos en builds subsecuentes
      # ==========================================
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.ui.android.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.ui.android.spec') }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            buildozer-project-${{ hashFiles('buildozer.ui.android.spec') }}-
            buildozer-project-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          # Toolchain PINEADO para matchear p4a v2024.01.21 (Python 3.11.x):
          # buildozer 1.5.0 + cython 0.29.x. Sin pin se instalaba buildozer/p4a
          # bleeding-edge (Python 3.14 + cython 3) y el build de Android rompía.
          pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      - name: Build Android APK
        run: |
          cp buildozer.ui.android.spec buildozer.spec
          # El caché (restore-keys) puede traer un clon viejo de p4a (master/3.14) y
          # builds para Python 3.14. Con el pin nuevo hay que limpiarlos para forzar
          # re-clone de p4a v2024.01.21 y rebuild limpio. Se conservan SDK/NDK en
          # ~/.buildozer (descargas caras).
          rm -rf .buildozer/android/platform/python-for-android
          rm -rf .buildozer/android/platform/build-*
          buildozer -v android debug

      - name: Find and rename APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          echo "APK found: $APK_PATH"
          cp "$APK_PATH" ./fiscalberry-android-gui.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscalberry-android-gui
          path: ./fiscalberry-android-gui.apk

  # ============================================
  # CREATE GITHUB RELEASE
  # ============================================
  create-release:
    needs: [version, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    # Publicar el release aunque Android falle: con que Linux y Windows compilen,
    # se publica con los binarios disponibles. Android es best-effort (su build es
    # frágil) y NO debe bloquear el release del resto de plataformas.
    if: >-
      always() &&
      needs.version.outputs.exists == 'false' &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux GUI Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-linux-gui
          path: ./artifacts/

      - name: Download Linux CLI Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-linux-cli
          path: ./artifacts/

      - name: Download Windows GUI Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-windows-gui
          path: ./artifacts/

      - name: Download Windows CLI Artifact
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-windows-cli
          path: ./artifacts/

      # Android es best-effort: si su build falló, el artifact no existe.
      # continue-on-error evita que eso tumbe el release.
      - name: Download Android Artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fiscalberry-android-gui
          path: ./artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # Crea el tag vX.Y.Z (leído de version.py) apuntando al commit pusheado
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # fail_on_unmatched_files=false: si falta el APK de Android (build frágil),
          # se publica igual con los binarios de Linux y Windows.
          fail_on_unmatched_files: false
          files: |
            ./artifacts/fiscalberry-linux-gui.tar.gz
            ./artifacts/fiscalberry-linux-cli.tar.gz
            ./artifacts/fiscalberry-windows-gui.zip
            ./artifacts/fiscalberry-windows-cli.zip
            ./artifacts/fiscalberry-android-gui.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
